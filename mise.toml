[tools]
python = "3.14.3"
poetry = "2.3.2"
github-cli = "2.88.1"
"aqua:asciinema/asciinema" = "3.2.0"
"aqua:asciinema/agg" = "1.7.0"

[env]
_.python.venv = { path = ".venv", create = true }

[settings]
lockfile = true

# Build and Publishing Tasks
[tasks.clean]
description = "Clean up build artifacts"
run = """
rm -rf build/ dist/ *.egg-info/
find . -type d -name __pycache__ -delete
find . -type f -name "*.pyc" -delete
"""

[tasks.build]
description = "Build the package"
run = "poetry build"

[tasks.publish]
description = "Publish to PyPI (requires authentication)"
run = "poetry publish"

[tasks.shell]
description = "Start a Poetry shell"
run = "poetry shell"

[tasks.install]
description = "Install dependencies"
run = "poetry install"

# `install` only reconciles the venv with poetry.lock; it never removes distributions that
# got there by other means, so a venv can accumulate packages that are in neither
# pyproject.toml nor poetry.lock. Those let an undeclared import type-check and run locally
# while failing in CI, and `poetry check --lock` does not catch them — it compares the lock
# to the manifest, not to the venv. Deleting the directory is the only way back to exactly
# what the lock describes.
#
# Delegating to `mise run install` instead of calling poetry directly is deliberate: the
# child mise process re-resolves [env]._.python.venv and recreates .venv with the python
# pinned in [tools], so a venv built on an older pin gets rebuilt on the current one.
# VIRTUAL_ENV must be unset first — mise activated the now-deleted venv for this task, and
# poetry would otherwise install into that stale path.
[tasks.reinstall]
description = "Delete .venv and reinstall dependencies from scratch"
run = """
rm -rf "$MISE_PROJECT_ROOT/.venv"
env -u VIRTUAL_ENV mise run install
"""

[tasks.check]
description = "Run all checks (format, lint, type-check, compat-check, lock-check, clidocs-check, depgraph-check)"
run = [
  { task = "format" },
  { task = "lint" },
  { task = "type-check" },
  { task = "compat-check" },
  { task = "lock-check" },
  { task = "clidocs-check" },
  { task = "depgraph-check" },
]

[tasks.check-all]
description = "Run all checks (format, lint, type-check, compat-check, test)"
run = [
  { task = "check" },
  { task = "test-all" },
]

# CI Workflow Tasks
[tasks.ci-test]
description = "Run all checks needed on CI"
run = [
  { task = "install" },
  { task = "build" },
  { task = "check-all" },
]

[tasks.ci-build]
description = "Run all checks needed on CI"
run = [
  { task = "install" },
  { task = "build" },
]

[tasks.ci-demo-record]
description = "Record the demo on CI"
run = [
  { task = "install" },
  { task = "demo-record" },
]

[tasks.ci-demo]
description = "Record and upload the demo on CI"
run = [
  { task = "install" },
  { task = "demo-record" },
  { task = "demo-upload" },
]

# Test Tasks
[tasks.test-unit]
description = "Run unit tests"
run = "poetry run pytest tests/ --ignore=tests/integration_fs/ -v"

[tasks.test-integration-fs]
description = "Run filesystem integration tests"
run = "poetry run pytest tests/integration_fs/ -n auto"

[tasks.test-all]
description = "Run all tests"
run = [
  { task = "test-unit" },
  { task = "test-integration-fs" },
]

# Lint / Formatting Tasks
[tasks.format]
description = "Format code with ruff"
run = "poetry run ruff format ."

[tasks.lint]
description = "Run ruff linting"
run = "poetry run ruff check photree/ tests/ build-scripts/"

[tasks.type-check]
description = "Run pyright type checking"
run = "poetry run pyright photree/ build-scripts/"

[tasks.compat-check]
description = "Verify no Python features above 3.12 are used"
run = "poetry run vermin --target=3.12- --no-tips --no-parse-comments photree/ tests/"

# mise.lock freshness check.
# CI may override the python version via `mise use`, which changes mise.toml
# and causes `mise lock` to produce a different lockfile than the committed one.
# The task temporarily reverts mise.toml to its git state for the check.
[tasks.lock-check]
description = "Check that mise.lock is up to date"
run = """
cp mise.toml mise.toml.lock-check-bak
git checkout mise.toml
mise lock
result=0
if ! git diff --quiet mise.lock; then
  echo "mise.lock is out of date. Run 'mise lock' and commit the result." >&2
  git diff mise.lock >&2
  result=1
fi
mv mise.toml.lock-check-bak mise.toml
exit $result
"""

# Demo Tasks
[tasks.demo]
description = "Record the demo and upload to asciinema.org"
run = [
  { task = "demo-record" },
  { task = "demo-upload" },
]

[tasks.demo-record]
description = "Record the demo and convert to GIF"
run = "./demo/record-demo.sh \"$(poetry version -s)\""

[tasks.demo-upload]
description = "Upload the locally recorded demo to asciinema.org"
run = "asciinema upload demo/demo.cast"

# Publishing from CI is disabled — GitHub-hosted runners have no route to
# asciinema.org (see .github/workflows/demo.yml). CI records the demo and keeps it as
# an artifact; this task is the manual half: fetch that artifact and publish it from a
# machine that can reach the host. On success it repoints the README's asciicast
# embed at the new recording and commits that one file. Forward flags with `--`:
#   mise run demo-upload-latest -- --dry-run     # fetch and report only
#   mise run demo-upload-latest -- --no-commit   # update README, leave it uncommitted
#   mise run demo-upload-latest -- --no-readme   # upload only
[tasks.demo-upload-latest]
description = "Download the demo recorded by CI and upload it to asciinema.org"
run = "poetry run python build-scripts/demoupload.py"

# Reference Documentation Generation Tasks
[tasks.reference-doc]
description = "Regenerate the reference documentation"
run = [
  { task = "clidocs" },
  { task = "depgraph" },
]

[tasks.clidocs]
description = "Regenerate CLI reference in docs/cli-reference.md"
run = "poetry run python build-scripts/clidocs.py"

[tasks.clidocs-check]
description = "Check that CLI reference in docs/cli-reference.md is up to date"
run = "poetry run python build-scripts/clidocs.py --check"

[tasks.depgraph]
description = "Regenerate Module Overview in docs/architecture.md"
run = "poetry run python build-scripts/depgraph.py"

[tasks.depgraph-check]
description = "Check that Module Overview in docs/architecture.md is up to date"
run = "poetry run python build-scripts/depgraph.py --check"

[tasks.depgraph-ascii]
description = "Generate module dependency graph (ASCII art)"
run = "poetry run python build-scripts/depgraph.py --format ascii"

[tasks.depgraph-mermaid]
description = "Print module dependency graph (mermaid syntax) to stdout"
run = "poetry run python build-scripts/depgraph.py --format mermaid"
