[project]
name = "photree"
description = "Manage photos in a directory tree"
readme = "README.md"
# Floor == local dev == CI: the latest CPython every dependency ships wheels for. See
# common/guidelines/coding/python.md "Python Version Policy". Documented exception: on 3.14
# rather than 3.15 because onnxruntime publishes no cp315 wheels; move to 3.15 when it does
# (check https://pypi.org/project/onnxruntime/#files). The upper bound keeps installs off an
# untested Python.
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sami Dalouche", email = "sami.dalouche@gmail.com" }]
dependencies = [
  "typer>=0.27.1,<1.0.0",
  "platformdirs>=4.11.0,<5.0",
  "mermaid-ascii-diagrams>=0.1.1",
  "pyexiftool>=0.5.0,<1.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "pyyaml>=6.0,<7.0",
  "insightface>=2,<2.2",
  "onnxruntime>=1.28.0,<2.0",
  "opencv-python-headless>=5.0.0.93,<5.1",
  "numpy>=2.5.1,<3.0",
  "faiss-cpu>=1.15.0,<2.0",
  "scikit-learn>=1.9.0,<2.0",
]
dynamic = ["version"]

[project.scripts]
photree = "photree.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.17,<0.18",
  "pyright>=1.1,<2.0",
  "pytest>=9.1.1,<10.0",
  "pytest-xdist>=3.8,<4.0",
  # The `python = ">=3.12,<4.0"` marker this carried under poetry is subsumed by
  # [project] requires-python, so it is dropped rather than translated.
  "pydeps>=3.0.7",
  "import-linter>=2.15,<3.0",
  "deadcode>=2.7.0,<3.0",
  # The shared build, docs and check commands (guidelines/project-setup/iglootools-cli.md in
  # iglootools/common). Pinned to the release tag; uv.lock records the commit it resolved to.
  "iglootools @ git+https://github.com/iglootools/common@v2.0.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Required, not optional: Renovate runs `uv lock --upgrade-package`, which triggers a
# build with no git context, and without a fallback every such PR fails outright.
#
# The cost is that "no git history" becomes a *successful* build producing 0.0.0 rather
# than an error — nothing else in the publish path would catch that, and a version number
# cannot be reused once PyPI has it. `mise run build-verify` is what closes the gap.
fallback-version = "0.0.0"

# Explicit rather than relying on hatchling's <NAME>/__init__.py heuristic: when the
# heuristic misses, the failure mode is a silently empty wheel rather than an error.
[tool.hatch.build.targets.wheel]
packages = ["photree"]

# Hatchling's sdist default is "every file not ignored by the VCS", which would ship
# tests/, docs/, demo/, .github/ and the lockfiles. Poetry shipped the
# package plus README/LICENSE/pyproject.toml; this keeps that shape.
[tool.hatch.build.targets.sdist]
only-include = ["photree"]

[tool.hatch.build]
# .gitignore is the only ignore file hatchling reads — not .git/info/exclude, not
# core.excludesfile. .gitignore now covers .DS_Store, so this is a guard that keeps the
# published artifact independent of ignore-file hygiene rather than the primary fix.
exclude = [".DS_Store"]

[tool.uv]
# Replaces the default [{ file = "pyproject.toml" }] rather than extending it, hence the
# explicit file entry. The git entry is what keeps `photree --version` honest: photree
# reads its version through importlib.metadata, which an editable install freezes into
# .dist-info at install time, so without this a new commit or tag leaves a stale version
# in place indefinitely.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# uv.lock does not resolve PEP 517 build dependencies — `uv build` resolves them fresh from
# PyPI on a cold cache — so these constraints are the only pin on the build backend, and
# on dunamai in particular, which is what computes the version. uv.lock does record the
# constraints themselves in its [manifest], so changing one needs a `uv lock`; on Renovate
# branches the renovate-mise-lock workflow runs it. Regenerate with:
#   printf '%s\n' hatchling uv-dynamic-versioning \
#     | uv pip compile - --no-annotate --no-header --quiet
# [build-system].requires is left unpinned so the two can never contradict each other.
build-constraint-dependencies = [
  "dunamai==1.26.4",
  "hatchling==1.33.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.7.0",
  "tomlkit==0.15.2",
  "trove-classifiers==2026.9.21.13",
  "uv-dynamic-versioning==0.14.1",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Every rule, minus those our conventions are against: iglootools/common's
# docs/architecture-decision-record.md, ADR-003, gives the reason for each entry below up
# to "photree's own exceptions". preview turns on PLW1514 (still a preview rule);
# explicit-preview-rules keeps ALL from selecting the other preview rules.
preview = true
explicit-preview-rules = true
select = ["ALL"]
extend-select = ["PLW1514"]
# deadcode's `# noqa: DCxx` markers, which RUF100 would otherwise report as unused.
external = ["DC"]
ignore = [
  # Each is the opposite of a D rule we keep: D211 and D213.
  "D203",
  "D212",
  # The LICENSE file covers every file.
  "CPY001",
  # Imports stay at module level, never in a TYPE_CHECKING block.
  "TC001",
  "TC002",
  "TC003",
  # The explicit else python.md asks for.
  "RET505",
  "RET506",
  "RET507",
  "RET508",
  # They count each case of a match.
  "C901",
  "PLR0911",
  "PLR0912",
  # Keyword seams add parameters by design; PLR0917 still caps positional ones.
  "PLR0913",
  # A command is an argument list, its program found on PATH.
  "S603",
  "S607",
  # photree's own exceptions.
  # Photo capture times are naive wall-clock instants: EXIF DateTimeOriginal carries
  # no offset, so attaching a tzinfo would invent information we do not have. DTZ005
  # (datetime.now() without tz) stays enabled — that one is a real bug.
  "DTZ001",
  "DTZ007",
  # Batch commands deliberately isolate per-item failures: one album that fails to
  # export/fix/refresh must not abort the whole run, so the exception is captured into
  # the batch result and reported to the user instead of propagating.
  "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# A test's name says what it checks; pytest asserts with assert; a test's literals are its
# specification; its "secrets" are fakes. S108 stays on: a test writes under tmp_path,
# never /tmp.
"tests/**" = ["D1", "PLR2004", "S101", "S105", "S106", "S107"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-statements = 30

# TID251: tests inject fakes through parameters instead of patching (docs/guidelines.md,
# Tests). unittest.mock is banned, and so is pytest.MonkeyPatch: tests/conftest.py
# replaces the monkeypatch fixture with one that fails, so the class is the only way
# left to patch. Each documented exception carries `# noqa: TID251` on its import, and
# RUF100 reports a noqa that is no longer needed.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock".msg = "Inject a fake through a parameter instead of patching (docs/guidelines.md, Tests)."
"pytest.MonkeyPatch".msg = "Inject a fake through a parameter instead of patching (docs/guidelines.md, Tests)."

[tool.pytest.ini_options]
markers = [
  "integration_fs: filesystem integration tests (full workflow)",
]
filterwarnings = [
  "ignore::DeprecationWarning:importlib._bootstrap", # FAISS SWIG bindings
]

[tool.pyright]
include = ["photree", "tests"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.14"
# uv creates the project venv at .venv; restating it here is what lets editors and
# language servers resolve imports against it, since they inherit no shell activation.
venvPath = "."
venv = ".venv"

# Unused code, enforced by `mise run lint-dead-code` (part of `lint`). Each entry is code
# that runs without being named in the project, so the scan cannot see it used.
[tool.deadcode]
ignore-names-if-decorated-with = [
  "@*.command", # Typer registers commands and callbacks by decorator
  "@*.callback",
  "@pytest.fixture", # pytest injects fixtures by parameter name
  "@field_validator", # Pydantic calls validators while validating
  "@model_validator",
]
ignore-names = [
  "main", # the [project.scripts] entry point
  "model_config", # read by Pydantic
  "pytestmark", # read by pytest
]

# Module boundaries, enforced by `mise run lint-boundaries` (part of `lint`). These
# contracts are the source of truth for the layering described in
# docs/architecture.md#layering; change them deliberately, in the same commit as the
# restructuring that motivates the change, and never by adding an ignore_imports entry to
# make a new edge pass.
[tool.importlinter]
root_package = "photree"
# Needed so the contracts below can name typer, which is a CLI-only dependency.
include_external_packages = true

# Top-level packages, highest first. A package may import only from layers below it;
# `|` separates siblings that must not import each other either.
[[tool.importlinter.contracts]]
name = "Top-level layering"
type = "layers"
layers = [
  "photree.cli",
  "photree.gallery | photree.demo | photree.check",
  "photree.albums | photree.collections",
  "photree.collection",
  "photree.album",
  # Sits below album because album/cli uses it; the contracts below keep it out of the
  # domain modules of every package above it.
  "photree.clihelpers",
  "photree.config",
  "photree.foundation",
  "photree.dates | photree.common",
]

# Domain/core code never reaches the CLI layer, directly or indirectly. Every package is
# listed by its non-CLI subpackages, because a package source would include its own cli/.
# A new subpackage outside cli/ or batchcli/ belongs on this list.
[[tool.importlinter.contracts]]
name = "Domain code does not depend on the CLI layer"
type = "forbidden"
source_modules = [
  "photree.dates",
  "photree.common",
  "photree.foundation",
  "photree.config",
  "photree.album.browsable",
  "photree.album.check",
  "photree.album.exif",
  "photree.album.exif_cache",
  "photree.album.exif_date_check",
  "photree.album.exporter",
  "photree.album.faces",
  "photree.album.fix",
  "photree.album.formats",
  "photree.album.id",
  "photree.album.importer",
  "photree.album.jpeg",
  "photree.album.live_photo",
  "photree.album.media",
  "photree.album.naming",
  "photree.album.refresh",
  "photree.album.staging",
  "photree.album.stats",
  "photree.album.store",
  "photree.albums.cmd_handler",
  "photree.albums.index",
  "photree.albums.media_index",
  "photree.albums.renamer",
  "photree.collection.check",
  "photree.collection.id",
  "photree.collection.importer",
  "photree.collection.init",
  "photree.collection.naming",
  "photree.collection.refresh",
  "photree.collection.stats",
  "photree.collection.store",
  "photree.gallery.browsable_refresh",
  "photree.gallery.cmd_handler",
  "photree.gallery.faces",
  "photree.gallery.import_plan",
  "photree.gallery.importer",
  "photree.gallery.index",
  "photree.gallery.output",
  "photree.gallery.stats",
]
forbidden_modules = [
  "photree.cli",
  "photree.*.cli",
  "photree.albums.batchcli",
  "photree.clihelpers",
  "typer",
]

# The package __init__ modules themselves, which the contract above cannot list without
# also covering each package's cli/ subpackage.
[[tool.importlinter.contracts]]
name = "Domain package roots do not depend on the CLI layer"
type = "forbidden"
as_packages = false
source_modules = [
  "photree.album",
  "photree.albums",
  "photree.collection",
  "photree.gallery",
]
forbidden_modules = [
  "photree.cli",
  "photree.*.cli",
  "photree.albums.batchcli",
  "photree.clihelpers",
  "typer",
]

# Direct-import allowlists, so a module added anywhere is covered without editing the
# forbidden list above.
[[tool.importlinter.contracts]]
name = "Only CLI modules import clihelpers"
type = "protected"
protected_modules = ["photree.clihelpers"]
allowed_importers = ["photree.cli", "photree.*.cli", "photree.albums.batchcli"]

[[tool.importlinter.contracts]]
name = "Only CLI modules import typer"
type = "protected"
protected_modules = ["typer"]
allowed_importers = [
  "photree.cli",
  "photree.*.cli",
  "photree.albums.batchcli",
  "photree.clihelpers",
]

# The shared batch layer is albums/batchcli; the gallery command group must not reach into
# the albums command group, and the shared layer must not depend on its own consumer.
[[tool.importlinter.contracts]]
name = "Command groups share batchcli, not each other"
type = "forbidden"
source_modules = ["photree.gallery.cli", "photree.albums.batchcli"]
forbidden_modules = ["photree.albums.cli"]
