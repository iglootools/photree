[project]
name = "photree"
description = "Manage photos in a directory tree"
readme = "README.md"
# Floor is Ubuntu 24.04 LTS's python3; upper bound keeps installs off an untested
# Python. See common/guidelines/coding/python.md "Python Version Policy".
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sami Dalouche", email = "sami.dalouche@gmail.com" }]
dependencies = [
  "typer>=0.27.1,<1.0.0",
  "platformdirs>=4.11.0,<5.0",
  "mermaid-ascii-diagrams>=0.1.1",
  "pyexiftool>=0.5.0,<1.0.0",
  "pydantic>=2.12.5,<3.0.0",
  "pyyaml>=6.0,<7.0",
  "uuid6>=2024.7.10,<2026.0.0",
  "insightface>=2,<2.1",
  "onnxruntime>=1.28.0,<2.0",
  "opencv-python-headless>=5.0.0.93,<5.1",
  "numpy>=2.5.1,<3.0",
  "faiss-cpu>=1.15.0,<2.0",
  "scikit-learn>=1.9.0,<2.0",
]
dynamic = ["version"]

[project.scripts]
photree = "photree.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "pyright>=1.1,<2.0",
  "pytest>=9.1.1,<10.0",
  "pytest-xdist>=3.8,<4.0",
  "vermin>=1.8.0,<2.0",
  # The `python = ">=3.12,<4.0"` marker this carried under poetry is subsumed by
  # [project] requires-python, so it is dropped rather than translated.
  "pydeps>=3.0.7",
  "import-linter>=2.15,<3.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Required, not optional: Renovate runs `uv lock --upgrade-package`, which triggers a
# build with no git context, and without a fallback every such PR fails outright.
#
# The cost is that "no git history" becomes a *successful* build producing 0.0.0 rather
# than an error — nothing else in the publish path would catch that, and a version number
# cannot be reused once PyPI has it. `mise run build-verify` is what closes the gap.
fallback-version = "0.0.0"

# Explicit rather than relying on hatchling's <NAME>/__init__.py heuristic: when the
# heuristic misses, the failure mode is a silently empty wheel rather than an error.
[tool.hatch.build.targets.wheel]
packages = ["photree"]

# Hatchling's sdist default is "every file not ignored by the VCS", which would ship
# tests/, docs/, demo/, build-scripts/, .github/ and the lockfiles. Poetry shipped the
# package plus README/LICENSE/pyproject.toml; this keeps that shape.
[tool.hatch.build.targets.sdist]
only-include = ["photree"]

[tool.hatch.build]
# .gitignore is the only ignore file hatchling reads — not .git/info/exclude, not
# core.excludesfile. .gitignore now covers .DS_Store, so this is a guard that keeps the
# published artifact independent of ignore-file hygiene rather than the primary fix.
exclude = [".DS_Store"]

[tool.uv]
# Replaces the default [{ file = "pyproject.toml" }] rather than extending it, hence the
# explicit file entry. The git entry is what keeps `photree --version` honest: photree
# reads its version through importlib.metadata, which an editable install freezes into
# .dist-info at install time, so without this a new commit or tag leaves a stale version
# in place indefinitely.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

# uv.lock does not cover PEP 517 build dependencies — `uv build` resolves them fresh from
# PyPI on a cold cache — so these constraints are the only pin on the build backend, and
# on dunamai in particular, which is what computes the version. Regenerate with:
#   printf '%s\n' hatchling uv-dynamic-versioning \
#     | uv pip compile - --no-annotate --no-header --quiet
# [build-system].requires is left unpinned so the two can never contradict each other.
build-constraint-dependencies = [
  "dunamai==1.26.2",
  "hatchling==1.32.0",
  "jinja2==3.1.6",
  "markupsafe==3.0.3",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.6.1.19",
  "uv-dynamic-versioning==0.14.0",
]

[tool.ruff]
target-version = "py312"

# Ruff 0.16 turned on a much larger default rule set (413 rules, up from 59). We take
# the new defaults; the exceptions below are rules that conflict with a deliberate
# design decision in this codebase rather than rules we have not gotten around to.
[tool.ruff.lint]
ignore = [
  # Photo capture times are naive wall-clock instants: EXIF DateTimeOriginal carries
  # no offset, so attaching a tzinfo would invent information we do not have. DTZ005
  # (datetime.now() without tz) stays enabled — that one is a real bug.
  "DTZ001",
  "DTZ007",
  # Batch commands deliberately isolate per-item failures: one album that fails to
  # export/fix/refresh must not abort the whole run, so the exception is captured into
  # the batch result and reported to the user instead of propagating.
  "BLE001",
]
# PLW1514 (open/read_text/write_text without an explicit encoding) is still a preview
# rule in ruff 0.16. explicit-preview-rules opts into that one rule alone, so the rest
# of the rule set keeps its stable behavior. It enforces the UTF-8-everywhere guideline:
# without it the locale encoding is used silently. Drop the preview flags once ruff
# stabilizes PLW1514.
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]

[tool.pytest.ini_options]
markers = [
    "integration_fs: filesystem integration tests (full workflow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:importlib._bootstrap",  # FAISS SWIG bindings
]

[tool.pyright]
pythonVersion = "3.12"
# uv creates the project venv at .venv; restating it here is what lets editors and
# language servers resolve imports against it, since they inherit no shell activation.
venvPath = "."
venv = ".venv"

# Module boundaries, enforced by `mise run import-check` (lint-imports). These contracts
# are the source of truth for the layering described in docs/architecture.md ("Module
# Boundaries"); change them deliberately, in the same commit as the restructuring that
# motivates the change, and never by adding an ignore_imports entry to make a new edge pass.
[tool.importlinter]
root_package = "photree"
# Needed so the contracts below can name typer, which is a CLI-only dependency.
include_external_packages = true

# Top-level packages, highest first. A package may import only from layers below it;
# `|` separates siblings that must not import each other either.
[[tool.importlinter.contracts]]
name = "Top-level layering"
type = "layers"
layers = [
  "photree.cli",
  "photree.gallery | photree.demo | photree.check",
  "photree.albums | photree.collections",
  "photree.collection",
  "photree.album",
  # Sits below album because album/cli uses it; the contracts below keep it out of the
  # domain modules of every package above it.
  "photree.clihelpers",
  "photree.config",
  "photree.foundation",
  "photree.dates | photree.common",
]

# Domain/core code never reaches the CLI layer, directly or indirectly. Every package is
# listed by its non-CLI subpackages, because a package source would include its own cli/.
# A new subpackage outside cli/ or batchcli/ belongs on this list.
[[tool.importlinter.contracts]]
name = "Domain code does not depend on the CLI layer"
type = "forbidden"
source_modules = [
  "photree.dates",
  "photree.common",
  "photree.foundation",
  "photree.config",
  "photree.album.browsable",
  "photree.album.check",
  "photree.album.exif",
  "photree.album.exif_cache",
  "photree.album.exif_date_check",
  "photree.album.exporter",
  "photree.album.faces",
  "photree.album.fix",
  "photree.album.formats",
  "photree.album.id",
  "photree.album.importer",
  "photree.album.jpeg",
  "photree.album.live_photo",
  "photree.album.media",
  "photree.album.naming",
  "photree.album.refresh",
  "photree.album.staging",
  "photree.album.stats",
  "photree.album.store",
  "photree.albums.cmd_handler",
  "photree.albums.index",
  "photree.albums.media_index",
  "photree.albums.renamer",
  "photree.collection.check",
  "photree.collection.id",
  "photree.collection.importer",
  "photree.collection.init",
  "photree.collection.naming",
  "photree.collection.refresh",
  "photree.collection.stats",
  "photree.collection.store",
  "photree.gallery.browsable_refresh",
  "photree.gallery.cmd_handler",
  "photree.gallery.faces",
  "photree.gallery.import_plan",
  "photree.gallery.importer",
  "photree.gallery.index",
  "photree.gallery.output",
  "photree.gallery.stats",
]
forbidden_modules = [
  "photree.cli",
  "photree.*.cli",
  "photree.albums.batchcli",
  "photree.clihelpers",
  "typer",
]

# The package __init__ modules themselves, which the contract above cannot list without
# also covering each package's cli/ subpackage.
[[tool.importlinter.contracts]]
name = "Domain package roots do not depend on the CLI layer"
type = "forbidden"
as_packages = false
source_modules = [
  "photree.album",
  "photree.albums",
  "photree.collection",
  "photree.gallery",
]
forbidden_modules = [
  "photree.cli",
  "photree.*.cli",
  "photree.albums.batchcli",
  "photree.clihelpers",
  "typer",
]

# Direct-import allowlists, so a module added anywhere is covered without editing the
# forbidden list above.
[[tool.importlinter.contracts]]
name = "Only CLI modules import clihelpers"
type = "protected"
protected_modules = ["photree.clihelpers"]
allowed_importers = ["photree.cli", "photree.*.cli", "photree.albums.batchcli"]

[[tool.importlinter.contracts]]
name = "Only CLI modules import typer"
type = "protected"
protected_modules = ["typer"]
allowed_importers = [
  "photree.cli",
  "photree.*.cli",
  "photree.albums.batchcli",
  "photree.clihelpers",
]

# The shared batch layer is albums/batchcli; the gallery command group must not reach into
# the albums command group, and the shared layer must not depend on its own consumer.
[[tool.importlinter.contracts]]
name = "Command groups share batchcli, not each other"
type = "forbidden"
source_modules = ["photree.gallery.cli", "photree.albums.batchcli"]
forbidden_modules = ["photree.albums.cli"]
